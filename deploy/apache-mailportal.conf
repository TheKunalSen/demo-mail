# /etc/apache2/sites-available/mailportal.conf
# Serves the portal at portal.vidyanetwork.com. After enabling it, run:
#   certbot --apache --redirect -d portal.vidyanetwork.com
# certbot copies this block into an HTTPS site; the X-Forwarded-Proto line then reports
# "https" there, which lets the portal mark its session cookie Secure.
<VirtualHost *:80>
    ServerName portal.vidyanetwork.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog  ${APACHE_LOG_DIR}/mailportal-error.log
    CustomLog ${APACHE_LOG_DIR}/mailportal-access.log combined
</VirtualHost>
